# Single source for the per-language .env examples (de/en/cs).
#
# Rendered by scripts/gen_env_example.py into:
#   dist-content/.env.example      (German — the shipped default)
#   dist-content/.env.en.example   (English)
#   dist-content/.env.cs.example   (Czech)
# tests/unit/test_env_example_generated.py pins committed files == generator
# output, so the variants can never drift apart again.
#
# Block shapes:
#   - section: {de,en,cs}                  → "# --- title ---…" separator line
#   - comment: {de,en,cs} + entries: [...] → "# "-prefixed comment, then entries
#     (entries are verbatim lines; leading "# " keeps an entry commented out)

header:
  de: |-
    SAP B1 MCP — Konfiguration

    Diese Datei neben das Binary (sapb1-mcp / sapb1-mcp.exe) als ".env" kopieren
    und ausfüllen, dann starten mit:  sapb1-mcp --env-file .env --port 8000

    Legende:  [PFLICHT] = muss gesetzt sein · [Optional] = Default in (Klammern).
    Auskommentierte Zeilen (#) nutzen den Default. Vollständige Erläuterungen:
    docs/konfiguration.de.md
  en: |-
    SAP B1 MCP — configuration

    Copy this file next to the binary (sapb1-mcp / sapb1-mcp.exe) as ".env",
    fill it in, then start with:  sapb1-mcp --env-file .env --port 8000

    Legend:  [REQUIRED] = must be set · [Optional] = default in (parentheses).
    Commented lines (#) use the default. Full reference: docs/konfiguration.md
  cs: |-
    SAP B1 MCP — konfigurace

    Zkopírujte tento soubor vedle binárky (sapb1-mcp / sapb1-mcp.exe) jako
    ".env", vyplňte a spusťte:  sapb1-mcp --env-file .env --port 8000

    Legenda:  [POVINNÉ] = musí být nastaveno · [Volitelné] = výchozí v (závorce).
    Zakomentované řádky (#) používají výchozí hodnotu. Úplný přehled:
    docs/konfiguration.cs.md
blocks:
- section:
    de: Service Layer (Verbindung zu SAP B1)
    en: Service Layer (connection to SAP B1)
    cs: Service Layer (připojení k SAP B1)
- comment:
    de: '[PFLICHT] Service-Layer-URL inkl. Version und abschließendem "/".'
    en: '[REQUIRED] Service Layer URL incl. version and trailing "/".'
    cs: '[POVINNÉ] URL Service Layeru vč. verze a koncového "/".'
  entries:
  - SAP_BASE_URL=https://ihr-sap-host:50000/b1s/v2/
- comment:
    de: '[PFLICHT] Wählbare CompanyDB(s) — eine oder mehrere, kommagetrennt.'
    en: '[REQUIRED] Selectable CompanyDB(s) — one or more, comma-separated.'
    cs: '[POVINNÉ] Volitelné CompanyDB — jedna nebo více, oddělené čárkou.'
  entries:
  - SAP_DATABASES=SBO_IhreFirma
- comment:
    de: |-
      [Optional] Zugriffsmodus (READ_ONLY). READ_WRITE schaltet die Schreib-Tools
      (anlegen/ändern/löschen) frei.
    en: |-
      [Optional] Access mode (READ_ONLY). READ_WRITE enables the write tools
      (create/update/delete).
    cs: |-
      [Volitelné] Režim přístupu (READ_ONLY). READ_WRITE zpřístupní zapisovací
      nástroje (vytvořit/změnit/smazat).
  entries:
  - SAP_OPERATION_MODE=READ_ONLY
- comment:
    de: |-
      [Optional] Mitgelieferte Auswertungen (AI_*-Abfragen) beim ersten Verbinden je
      CompanyDB ausbringen. Default true, benötigt READ_WRITE — im Lesebetrieb wird
      es übersprungen. Alternativ im Chat über sap_deploy_queries anstoßen.
    en: |-
      [Optional] Deploy the bundled reports (AI_* queries) on first connect per
      CompanyDB. Default true, requires READ_WRITE — skipped in read-only mode.
      Alternatively trigger via sap_deploy_queries in the chat.
    cs: |-
      [Volitelné] Nasadit dodané přehledy (dotazy AI_*) při prvním připojení pro
      každou CompanyDB. Výchozí true, vyžaduje READ_WRITE — v režimu čtení se
      přeskočí. Alternativně spusťte v chatu přes sap_deploy_queries.
  entries:
  - SAP_AUTO_DEPLOY_QUERIES=true
- comment:
    de: |-
      [Optional] Selbstsigniertes SL-Zertifikat akzeptieren (false). Für Produktion
      möglichst ein gültiges Zertifikat verwenden.
    en: |-
      [Optional] Accept a self-signed SL certificate (false). Use a valid
      certificate in production whenever possible.
    cs: |-
      [Volitelné] Akceptovat self-signed certifikát SL (false). V produkci pokud
      možno používejte platný certifikát.
  entries:
  - SAP_ALLOW_SELF_SIGNED_CERT=false
- comment:
    de: '[Optional] Maximale Zeilen pro Ergebnisseite (200).'
    en: '[Optional] Maximum rows per result page (200).'
    cs: '[Volitelné] Maximum řádků na stránku výsledků (200).'
  entries:
  - SAP_MAX_PAGE_SIZE=200
- comment:
    de: '[Optional] Parallele Service-Layer-Requests (10).'
    en: '[Optional] Parallel Service Layer requests (10).'
    cs: '[Volitelné] Souběžné požadavky na Service Layer (10).'
  entries:
  - SAP_MAX_CONCURRENT_REQUESTS=10
- comment:
    de: '[Optional] Timeout je SL-Request in Sekunden (60).'
    en: '[Optional] Timeout per SL request in seconds (60).'
    cs: '[Volitelné] Timeout jednoho požadavku SL v sekundách (60).'
  entries:
  - SAP_TIMEOUT_SECONDS=60
- comment:
    de: '[Optional] Automatischer Logout einer untätigen SL-Session in Sekunden (1500).'
    en: '[Optional] Automatic logout of an idle SL session in seconds (1500).'
    cs: '[Volitelné] Automatické odhlášení nečinné relace SL v sekundách (1500).'
  entries:
  - SAP_IDLE_LOGOUT_SECONDS=1500
- comment:
    de: |-
      [Optional] Datenbanktyp übersteuern (HANA / MSSQL). Normalerweise wird er
      automatisch erkannt — nur bei fehlerhafter Erkennung setzen.
    en: |-
      [Optional] Override the database type (HANA / MSSQL). Normally detected
      automatically — set only if detection is wrong.
    cs: |-
      [Volitelné] Přepsat typ databáze (HANA / MSSQL). Běžně se rozpozná
      automaticky — nastavte jen při chybné detekci.
  entries:
  - '# SAP_DB_SERVER_TYPE=HANA'
- comment:
    de: |-
      [Optional] Sprache der Server-Meldungen (exe-Start, Web-Login, Auth-Fehler):
      de (Default), en oder cs. Betrifft NICHT die Chat-Antworten des Assistenten
      (die folgen automatisch der Sprache des Nutzers).
    en: |-
      [Optional] Language of the server messages (exe startup, web login, auth
      errors): de (default), en or cs. Does NOT affect the assistant's chat
      replies (those automatically follow the user's language).
    cs: |-
      [Volitelné] Jazyk zpráv serveru (start exe, web login, chyby ověření):
      de (výchozí), en nebo cs. NEOVLIVŇUJE odpovědi asistenta v chatu (ty
      automaticky sledují jazyk uživatele).
  entries:
  - '# SAP_LANG=de'
- comment:
    de: |-
      [Optional] Bind-Adressen des HTTP-Servers, kommagetrennt. Default: ALLE
      Interfaces (0.0.0.0) — andere Rechner erreichen den Server direkt; Firewall
      beachten. Nur lokal: SAP_BIND_HOSTS=127.0.0.1
    en: |-
      [Optional] Bind addresses of the HTTP server, comma-separated. Default: ALL
      interfaces (0.0.0.0) — other machines reach the server directly; mind the
      firewall. Local only: SAP_BIND_HOSTS=127.0.0.1
    cs: |-
      [Volitelné] Adresy, na kterých HTTP server naslouchá, oddělené čárkou.
      Výchozí: VŠECHNA rozhraní (0.0.0.0) — ostatní počítače se připojí přímo;
      pozor na firewall. Jen lokálně: SAP_BIND_HOSTS=127.0.0.1
  entries:
  - '# SAP_BIND_HOSTS='
- comment:
    de: |-
      [Optional] TLS/HTTPS direkt im MCP (eingehende Client-Verbindungen). Beide
      Dateien (PEM) setzen -> Server spricht HTTPS; weglassen -> HTTP. Getrennt von
      SAP_ALLOW_SELF_SIGNED_CERT (das gilt AUSGEHEND zu SAP/Keycloak). Bei aktivem
      TLS SAP_PUBLIC_URL auf https://... setzen.
    en: |-
      [Optional] TLS/HTTPS directly in the MCP (inbound client connections). Set
      both files (PEM) -> server speaks HTTPS; omit -> HTTP. Separate from
      SAP_ALLOW_SELF_SIGNED_CERT (which applies OUTBOUND to SAP/Keycloak). With
      TLS on, set SAP_PUBLIC_URL to https://...
    cs: |-
      [Volitelné] TLS/HTTPS přímo v MCP (příchozí spojení klientů). Nastavte oba
      soubory (PEM) -> server mluví HTTPS; vynechte -> HTTP. Odděleno od
      SAP_ALLOW_SELF_SIGNED_CERT (to platí ODCHOZÍM směrem k SAP/Keycloaku). Při
      zapnutém TLS nastavte SAP_PUBLIC_URL na https://...
  entries:
  - '# SAP_TLS_CERT_FILE=C:\certs\mcp.crt'
  - '# SAP_TLS_KEY_FILE=C:\certs\mcp.key'
- comment:
    de: '[Optional] Passwort, falls der private Schluessel verschluesselt ist.'
    en: '[Optional] Password if the private key is encrypted.'
    cs: '[Volitelné] Heslo, pokud je privátní klíč šifrovaný.'
  entries:
  - '# SAP_TLS_KEY_PASSWORD='
- comment:
    de: |-
      TLS-Haertung (Rechenzentrum):
      [Optional] Mindest-TLS-Version: 1.2 (Default) oder 1.3.
    en: |-
      TLS hardening (data center):
      [Optional] Minimum TLS version: 1.2 (default) or 1.3.
    cs: |-
      Zpřísnění TLS (datové centrum):
      [Volitelné] Minimální verze TLS: 1.2 (výchozí) nebo 1.3.
  entries:
  - '# SAP_TLS_MIN_VERSION=1.2'
- comment:
    de: '[Optional] OpenSSL-Cipher-String pinnen (nur TLS 1.2; leer = sichere Defaults).'
    en: '[Optional] Pin an OpenSSL cipher string (TLS 1.2 only; empty = safe defaults).'
    cs: '[Volitelné] Pevný OpenSSL cipher string (jen TLS 1.2; prázdné = bezpečné výchozí).'
  entries:
  - '# SAP_TLS_CIPHERS='
- comment:
    de: '[Optional] Client-CA (PEM) -> erzwingt Client-Zertifikate (mTLS).'
    en: '[Optional] Client CA (PEM) -> requires client certificates (mTLS).'
    cs: '[Volitelné] Klientská CA (PEM) -> vynutí klientské certifikáty (mTLS).'
  entries:
  - '# SAP_TLS_CLIENT_CA_FILE='
- section:
    de: Anmeldung
    en: Authentication
    cs: Přihlášení
- comment:
    de: |-
      [Optional] Prüfweg gegen die Service Layer:
        basic (Default) = Benutzer/Passwort direkt an die SL (kein Keycloak).
        bearer          = Browser-SSO über Keycloak (Auth Code + PKCE); das Token geht
                          bei JEDEM Service-Layer-Aufruf mit. Passwort erreicht den
                          MCP nie. Ab FP 2208 mit Tokens des SAP-Authentication-
                          Servers; eigener Identity Provider als Aussteller nur
                          nach Abstimmung (siehe docs/sso-keycloak.de.md).
      Bei bearer sind SAP_PUBLIC_URL + der IdP-Block unten PFLICHT; zusaetzlich
      SAP_SLD_URL (CompanyID) — oder, wenn EUER eigener Provider die Tokens
      ausstellt, stattdessen SAP_COMPANY_IDS (siehe docs/sso-keycloak.de.md).
      Einrichtung inkl. der SAP-seitigen Schritte: docs/sso-keycloak.de.md
    en: |-
      [Optional] Authentication path against the Service Layer:
        basic (default) = user/password straight to the SL (no Keycloak).
        bearer          = browser SSO via Keycloak (Auth Code + PKCE); the token is
                          sent with EVERY Service Layer call. The password never
                          reaches the MCP. From FP 2208 with tokens of the SAP
                          Authentication Server; your own identity provider as
                          issuer only after alignment (see docs/sso-keycloak.md).
      With bearer, SAP_PUBLIC_URL + the IdP block below are REQUIRED; additionally
      SAP_SLD_URL (CompanyID) — or, if YOUR own provider issues the tokens,
      SAP_COMPANY_IDS instead (see docs/sso-keycloak.md).
      Setup incl. the SAP-side steps: docs/sso-keycloak.md
    cs: |-
      [Volitelné] Způsob ověření vůči Service Layeru:
        basic (výchozí) = uživatel/heslo přímo na SL (bez Keycloaku).
        bearer          = browser SSO přes Keycloak (Auth Code + PKCE); token se
                          posílá s KAŽDÝM voláním Service Layeru. Heslo se do MCP
                          nikdy nedostane. Od FP 2208 s tokeny SAP Authentication
                          Serveru; vlastní identity provider jako vydavatel jen
                          po dohodě (viz docs/sso-keycloak.cs.md).
      U bearer jsou SAP_PUBLIC_URL + blok IdP níže POVINNÉ; navíc SAP_SLD_URL
      (CompanyID) — nebo, pokud tokeny vydává VÁŠ vlastní provider, místo toho
      SAP_COMPANY_IDS (viz docs/sso-keycloak.cs.md).
      Nastavení vč. kroků na straně SAP: docs/sso-keycloak.cs.md
  entries:
  - SAP_AUTH_MODE=basic
- comment:
    de: |-
      [Optional, EMPFOHLEN true] Login nur über Dialog (Elicit) bzw. Web-Login
      zulassen — nie als Chat-/Tool-Argument, damit Zugangsdaten nicht in den
      LLM-Kontext geraten.
    en: |-
      [Optional, RECOMMENDED true] Allow login only via dialog (elicit) or web
      login — never as a chat/tool argument, so credentials never enter the
      LLM context.
    cs: |-
      [Volitelné, DOPORUČENO true] Povolit přihlášení jen dialogem (elicit) nebo
      web loginem — nikdy jako argument chatu/nástroje, aby se přihlašovací
      údaje nedostaly do kontextu LLM.
  entries:
  - SAP_DISABLE_INLINE_LOGIN=true
- comment:
    de: |-
      [Optional] Öffentliche URL DIESER Instanz für den Browser-Login-Fallback
      (Hosts ohne native Eingabemaske, z. B. Claude Desktop). Daraus baut der Server
      die Login-URL <SAP_PUBLIC_URL>/login?t=…
        LOKAL (gleiche Maschine): MIT Port → http://127.0.0.1:8000
                                  (Port MUSS zum Serverstart passen).
        ZENTRAL/hinter Reverse-Proxy: die öffentliche HTTPS-URL → https://mcp.kunde.intern
        (http:// ist nur für 127.0.0.1 erlaubt.)
    en: |-
      [Optional] Public URL of THIS instance for the browser-login fallback
      (hosts without a native input dialog, e.g. Claude Desktop). The server
      builds the login URL <SAP_PUBLIC_URL>/login?t=… from it.
        LOCAL (same machine): WITH port → http://127.0.0.1:8000
                              (the port MUST match the server start).
        CENTRAL/behind a reverse proxy: the public HTTPS URL → https://mcp.customer.internal
        (http:// is allowed for 127.0.0.1 only.)
    cs: |-
      [Volitelné] Veřejná URL TÉTO instance pro záložní přihlášení prohlížečem
      (hosté bez nativního dialogu, např. Claude Desktop). Server z ní staví
      přihlašovací URL <SAP_PUBLIC_URL>/login?t=…
        LOKÁLNĚ (stejný stroj): S portem → http://127.0.0.1:8000
                                (port MUSÍ odpovídat startu serveru).
        CENTRÁLNĚ/za reverse proxy: veřejná HTTPS URL → https://mcp.zakaznik.internal
        (http:// je povoleno jen pro 127.0.0.1.)
  entries:
  - SAP_PUBLIC_URL=http://127.0.0.1:8000
- section:
    de: Identity Provider / SSO — NUR bei SAP_AUTH_MODE=bearer
    en: Identity provider / SSO — ONLY with SAP_AUTH_MODE=bearer
    cs: Identity provider / SSO — JEN při SAP_AUTH_MODE=bearer
- comment:
    de: |-
      Bei basic komplett weglassen. Client-ID/-Secret stammen aus dem Extension
      Single Sign-On Manager (Client Type "Web App", b1-ext-…). Die Redirect-URI
      <SAP_PUBLIC_URL>/callback muss dort hinterlegt sein.
      Vollständige Anleitung: docs/sso-keycloak.de.md

      EMPFOHLEN: Nur SAP_SLD_URL setzen — der Server ermittelt Token-, Authorize-,
      Logout- und Schlüssel-Endpunkt beim Start automatisch über die SLD.

      Stellt EUER eigener Identity Provider die Tokens aus (Principal Propagation),
      gilt stattdessen: SAP_IDP_TOKEN_URL auf euren Provider zeigen und die beim
      Tenant-Binding notierten CompanyIDs setzen —
        SAP_COMPANY_IDS=SBO_PROD:1,SBO_TEST:2
      Dann wird die SLD nicht gebraucht (Port 40000 entbehrlich). Es muessen ALLE
      Datenbanken aus SAP_DATABASES aufgefuehrt sein, sonst startet der Server nicht.
    en: |-
      Omit entirely with basic. Client id/secret come from the Extension
      Single Sign-On Manager (client type "Web App", b1-ext-…). The redirect URI
      <SAP_PUBLIC_URL>/callback must be registered there.
      Full guide: docs/sso-keycloak.md

      RECOMMENDED: set only SAP_SLD_URL — the server discovers the token,
      authorize, logout and key endpoints automatically via the SLD at startup.

      If YOUR own identity provider issues the tokens (principal propagation),
      instead point SAP_IDP_TOKEN_URL at your provider and set the CompanyIDs
      noted during tenant binding —
        SAP_COMPANY_IDS=SBO_PROD:1,SBO_TEST:2
      The SLD is then not needed (port 40000 dispensable). ALL databases from
      SAP_DATABASES must be listed, otherwise the server refuses to start.
    cs: |-
      U basic zcela vynechte. Client id/secret pochází z Extension Single
      Sign-On Manageru (typ klienta "Web App", b1-ext-…). Redirect URI
      <SAP_PUBLIC_URL>/callback tam musí být zaregistrována.
      Úplný návod: docs/sso-keycloak.cs.md

      DOPORUČENO: nastavte jen SAP_SLD_URL — server při startu automaticky zjistí
      token, authorize, logout a klíčové endpointy přes SLD.

      Pokud tokeny vydává VÁŠ vlastní identity provider (principal propagation),
      nasměrujte místo toho SAP_IDP_TOKEN_URL na svého providera a nastavte
      CompanyID poznamenané při tenant bindingu —
        SAP_COMPANY_IDS=SBO_PROD:1,SBO_TEST:2
      SLD pak není potřeba (port 40000 postradatelný). Musí být uvedeny VŠECHNY
      databáze ze SAP_DATABASES, jinak server nenastartuje.
- comment:
    de: '[PFLICHT wenn bearer] Client-ID (Extension Single Sign-On Manager).'
    en: '[REQUIRED with bearer] Client id (Extension Single Sign-On Manager).'
    cs: '[POVINNÉ při bearer] Client id (Extension Single Sign-On Manager).'
  entries:
  - '# SAP_IDP_CLIENT_ID=b1-ext-web-xxxxxxxx'
- comment:
    de: '[PFLICHT wenn bearer] Client-Secret (wird nur EINMAL angezeigt).'
    en: '[REQUIRED with bearer] Client secret (shown only ONCE).'
    cs: '[POVINNÉ při bearer] Client secret (zobrazí se jen JEDNOU).'
  entries:
  - '# SAP_IDP_CLIENT_SECRET='
- comment:
    de: |-
      [PFLICHT wenn bearer] SLD-Adresse: CompanyID-Auflösung (X-b1-companyid) und
      automatische Ermittlung aller IdP-Endpunkte.
    en: |-
      [REQUIRED with bearer] SLD address: CompanyID resolution (X-b1-companyid)
      and automatic discovery of all IdP endpoints.
    cs: |-
      [POVINNÉ při bearer] Adresa SLD: překlad CompanyID (X-b1-companyid) a
      automatické zjištění všech endpointů IdP.
  entries:
  - '# SAP_SLD_URL=https://ihr-sap-host:40000'
- comment:
    de: '[Alternative zu SAP_SLD_URL] Token-Endpoint des Keycloak-Realms explizit.'
    en: '[Alternative to SAP_SLD_URL] Token endpoint of the Keycloak realm, explicit.'
    cs: '[Alternativa k SAP_SLD_URL] Token endpoint Keycloak realmu, explicitně.'
  entries:
  - '# SAP_IDP_TOKEN_URL=https://ihr-sap-host:40020/auth/realms/sapb1/protocol/openid-connect/token'
- comment:
    de: |-
      [Optional] OAuth-Scopes. Default 'openid' (wie die offiziellen SAP-Beispiele).
      Erweiterte Scopes nur setzen, wenn sie dem Client zugewiesen sind.
    en: |-
      [Optional] OAuth scopes. Default 'openid' (like the official SAP samples).
      Set extended scopes only if they are assigned to the client.
    cs: |-
      [Volitelné] OAuth scopes. Výchozí 'openid' (jako oficiální ukázky SAP).
      Rozšířené scopes nastavte jen tehdy, jsou-li klientovi přiřazeny.
  entries:
  - '# SAP_IDP_SCOPE=openid'
- comment:
    de: |-
      [Optional] Authorize-Endpoint; sonst aus der Token-URL abgeleitet
      (…/token → …/auth). PFLICHT, wenn der Identity Provider kein Keycloak ist
      (z. B. Microsoft Entra ID, Okta).
    en: |-
      [Optional] Authorize endpoint; otherwise derived from the token URL
      (…/token → …/auth). REQUIRED when the identity provider is not a Keycloak
      (e.g. Microsoft Entra ID, Okta).
    cs: |-
      [Volitelné] Authorize endpoint; jinak odvozen z token URL
      (…/token → …/auth). POVINNÉ, pokud identity provider není Keycloak
      (např. Microsoft Entra ID, Okta).
  entries:
  - '# SAP_IDP_AUTHORIZE_URL='
- comment:
    de: |-
      [Optional] Weitere IdP-Endpunkte. Werden normalerweise über SAP_SLD_URL
      automatisch ermittelt — nur setzen, wenn die Auto-Ermittlung übersteuert
      werden muss:
    en: |-
      [Optional] Further IdP endpoints. Normally discovered automatically via
      SAP_SLD_URL — set only when the auto-discovery must be overridden:
    cs: |-
      [Volitelné] Další endpointy IdP. Běžně se zjistí automaticky přes
      SAP_SLD_URL — nastavte jen tehdy, je-li nutné automatiku přepsat:
  entries:
  - '# SAP_IDP_ISSUER='
  - '# SAP_IDP_JWKS_URL='
  - '# SAP_IDP_END_SESSION_URL='
  - '# SAP_IDP_REVOCATION_URL='
- comment:
    de: |-
      Hinweis: Die früheren Namen SAP_KEYCLOAK_TOKEN_URL / _CLIENT_ID / _CLIENT_SECRET
      / _AUTHORIZE_URL / _SCOPE funktionieren weiterhin (gleiche Bedeutung).
    en: |-
      Note: the former names SAP_KEYCLOAK_TOKEN_URL / _CLIENT_ID / _CLIENT_SECRET
      / _AUTHORIZE_URL / _SCOPE keep working (same meaning).
    cs: |-
      Poznámka: dřívější názvy SAP_KEYCLOAK_TOKEN_URL / _CLIENT_ID / _CLIENT_SECRET
      / _AUTHORIZE_URL / _SCOPE fungují nadále (stejný význam).
- section:
    de: Anhänge (Datei-Upload per Referenz)
    en: Attachments (file upload by reference)
    cs: Přílohy (nahrávání souborů odkazem)
- comment:
    de: |-
      [Optional] Maximale Dateigröße pro Anhang-Upload in MB (Browser-Upload-Seite,
      source_url, file_path). Default 25. Details: docs/anhaenge.de.md
    en: |-
      [Optional] Maximum file size per attachment upload in MB (browser upload
      page, source_url, file_path). Default 25. Details: docs/anhaenge.md
    cs: |-
      [Volitelné] Maximální velikost souboru pro nahrání přílohy v MB (stránka
      nahrání v prohlížeči, source_url, file_path). Výchozí 25. Detaily: docs/anhaenge.cs.md
  entries:
  - '# SAP_UPLOAD_MAX_MB=25'
- comment:
    de: |-
      [Optional] Hosts, von denen sap_attachment eine source_url laden darf,
      kommagetrennt ("host" oder "*.domain"). Leer = Weg deaktiviert. Nur HTTPS,
      keine privaten Adressen, keine Weiterleitungen.
    en: |-
      [Optional] Hosts sap_attachment may fetch a source_url from, comma-separated
      ("host" or "*.domain"). Empty = this way is disabled. HTTPS only, no private
      addresses, no redirects.
    cs: |-
      [Volitelné] Hostitelé, ze kterých smí sap_attachment stáhnout source_url,
      oddělené čárkou ("host" nebo "*.domain"). Prázdné = cesta vypnuta. Pouze
      HTTPS, žádné privátní adresy, žádná přesměrování.
  entries:
  - '# SAP_ATTACHMENT_URL_ALLOWLIST=files.example.com,*.sharepoint.com'
- comment:
    de: |-
      [Optional] Verzeichnis, unterhalb dessen sap_attachment einen file_path lesen
      darf (lokale Installation / Netzfreigabe). Leer = Weg deaktiviert.
    en: |-
      [Optional] Directory below which sap_attachment may read a file_path (local
      install / network share). Empty = this way is disabled.
    cs: |-
      [Volitelné] Adresář, pod kterým smí sap_attachment číst file_path (lokální
      instalace / síťové sdílení). Prázdné = cesta vypnuta.
  entries:
  - '# SAP_ATTACHMENT_DIR=C:\sapb1-mcp\attachments'
- section:
    de: Lizenz
    en: License
    cs: Licence
- comment:
    de: |-
      [Optional] Pfad zur Lizenzdatei. NICHT nötig, wenn "versino.key" neben dem
      Binary liegt (Auto-Discovery).
    en: |-
      [Optional] Path to the license file. NOT needed when "versino.key" sits
      next to the binary (auto-discovery).
    cs: |-
      [Volitelné] Cesta k licenčnímu souboru. NENÍ potřeba, pokud "versino.key"
      leží vedle binárky (auto-discovery).
  entries:
  - SAP_LICENSE_FILE=versino.key
- comment:
    de: '[Optional] Lizenz-Token direkt — Alternative zur Datei.'
    en: '[Optional] License token inline — alternative to the file.'
    cs: '[Volitelné] Licenční token přímo — alternativa k souboru.'
  entries:
  - '# SAP_LICENSE=<lizenz-token>'
- section:
    de: Logging
    en: Logging
    cs: Logování
- comment:
    de: |-
      Warnungen/Fehler werden automatisch nach
        %APPDATA%\Versino\sapb1-mcp\sapb1-mcp.log
      geschrieben (JSON-Zeilen, fester Pfad, nicht konfigurierbar). Die Datei ist
      auf 1 MB begrenzt — danach werden die aeltesten Eintraege entfernt.
    en: |-
      Warnings/errors are written automatically to
        %APPDATA%\Versino\sapb1-mcp\sapb1-mcp.log
      (JSON lines, fixed path, not configurable). The file is capped at 1 MB —
      beyond that the oldest entries are pruned.
    cs: |-
      Varování/chyby se automaticky zapisují do
        %APPDATA%\Versino\sapb1-mcp\sapb1-mcp.log
      (řádky JSON, pevná cesta, nekonfigurovatelné). Soubor je omezen na 1 MB —
      poté se nejstarší záznamy odstraní.
- section:
    de: Phone-Home / automatische Abo-Erneuerung
    en: Phone-home / automatic subscription renewal
    cs: Phone-home / automatické obnovení předplatného
- comment:
    de: |-
      [Optional] Enrollment-Token für Phone-Home / automatische Abo-Erneuerung.
      NORMALFALL: bereits in der versino.key eingebacken — hier NICHTS nötig.
      Diese Variable nur setzen, um den eingebauten Token zu überschreiben
      (Test/Staging). Übertragen werden nur Metadaten (customer_id, edition,
      version, Seat-Anzahl), keine Geschäftsdaten. Air-gapped: kein Token →
      der ausgelieferte Schlüssel gilt unverändert bis zum Ablaufdatum.
    en: |-
      [Optional] Enrollment token for phone-home / automatic subscription renewal.
      NORMALLY already baked into versino.key — NOTHING needed here.
      Set this variable only to override the built-in token (test/staging).
      Only metadata is transmitted (customer_id, edition, version, seat count),
      no business data. Air-gapped: no token → the delivered key stays valid
      unchanged until its expiry date.
    cs: |-
      [Volitelné] Enrollment token pro phone-home / automatické obnovení
      předplatného. BĚŽNĚ už zapečen ve versino.key — zde NENÍ potřeba nic.
      Tuto proměnnou nastavte jen pro přepsání vestavěného tokenu (test/staging).
      Přenášejí se pouze metadata (customer_id, edice, verze, počet seatů),
      žádná obchodní data. Air-gapped: bez tokenu → dodaný klíč platí beze změny
      do data expirace.
  entries:
  - '# SAP_ENROLLMENT_TOKEN=<override-token>'
- comment:
    de: '[Optional] Intervall der Phone-Home-Validierung in Sekunden (3600).'
    en: '[Optional] Interval of the phone-home validation in seconds (3600).'
    cs: '[Volitelné] Interval validace phone-home v sekundách (3600).'
  entries:
  - '# SAP_PHONE_HOME_INTERVAL_SECONDS=3600'
- comment:
    de: |-
      [Optional] Pfad für erneuerte Token (stiller Renewal-Cache). Default:
      "versino.renewed" neben der Lizenz bzw. dem Binary.
    en: |-
      [Optional] Path for renewed tokens (silent renewal cache). Default:
      "versino.renewed" next to the license or the binary.
    cs: |-
      [Volitelné] Cesta pro obnovené tokeny (tichá renewal cache). Výchozí:
      "versino.renewed" vedle licence, resp. binárky.
  entries:
  - '# SAP_LICENSE_CACHE_FILE=versino.renewed'
- comment:
    de: |-
      [Optional] Pfad der Installations-Identität (install_identity.json).
      Der Default ist RELATIV zum Arbeitsverzeichnis. Im Container mit
      read-only-Rootfs oder auf einem flüchtigen Verzeichnis muss hier ein
      persistenter Pfad stehen — sonst schlägt das Schreiben fehl bzw. entsteht
      bei jedem Start ein neues Schlüsselpaar, und die Installation registriert
      sich jedes Mal neu.
    en: |-
      [Optional] Path of the installation identity (install_identity.json).
      The default is RELATIVE to the working directory. In a container with a
      read-only rootfs, or on an ephemeral directory, set a persistent path here
      — otherwise the write fails, or a fresh keypair is created on every start
      and the installation registers itself again each time.
    cs: |-
      [Volitelné] Cesta identity instalace (install_identity.json).
      Výchozí hodnota je RELATIVNÍ k pracovnímu adresáři. V kontejneru s
      read-only rootfs nebo v pomíjivém adresáři zde musí být trvalá cesta —
      jinak zápis selže, případně se při každém startu vytvoří nový klíčový pár
      a instalace se registruje znovu.
  entries:
  - '# SAP_INSTALL_IDENTITY_PATH=/data/install_identity.json'
- comment:
    de: |-
      [Optional] Monotoner Zeit-Anker gegen Uhr-Rückstellung (Härtung für
      air-gapped Betrieb). Ohne Pfad deaktiviert.
    en: |-
      [Optional] Monotonic time anchor against clock rollback (hardening for
      air-gapped operation). Disabled without a path.
    cs: |-
      [Volitelné] Monotónní časová kotva proti vrácení hodin (zpřísnění pro
      air-gapped provoz). Bez cesty vypnuto.
  entries:
  - '# SAP_TIME_ANCHOR_PATH=versino.timeanchor'
